[project]
name = "mcprobe"
version = "0.1.0"
description = "MCProbe: MCP server security assessment"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "mcp>=2.3,<3",
    "openai>=1.50",
    "neatlogs>=1.4",
    "pydantic>=2.7",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
